<script>
/* Chronos — Timezone Dataset
 * Each country maps to one or more IANA zones. Multi-zone countries list
 * each zone with a human label. Coverage: ~155 countries/territories.
 */

const CHRONOS_COUNTRIES = {{COUNTRIES_JSON}};


const CHRONOS_UTC = { id: "UTC", label: "UTC" };

if (typeof module !== "undefined" && module.exports) {
  module.exports = { CHRONOS_COUNTRIES, CHRONOS_UTC };
}


/* ---------------- Standard times (PST, EST, GMT, CET ...) ----------------
 * Regional entries ("PT", "ET", "UK" ...) follow daylight saving like the real
 * region does. Fixed entries ("PST", "PDT", "EST" ...) stay at one UTC offset
 * all year, exactly as the abbreviation says. `zone` is the IANA zone used for
 * the maths; Etc/GMT+8 means UTC-8 (the sign is inverted in IANA names).
 */
const STANDARD_TIMES = [
  // Regional times that switch between standard and daylight time
  { id: "std:PT",  label: "PT",  name: "Pacific Time",  zone: "America/Los_Angeles", std: "PST", dst: "PDT", kw: "pacific los angeles california seattle vancouver" },
  { id: "std:MT",  label: "MT",  name: "Mountain Time", zone: "America/Denver",      std: "MST", dst: "MDT", kw: "mountain denver colorado utah" },
  { id: "std:CT",  label: "CT",  name: "Central Time",  zone: "America/Chicago",     std: "CST", dst: "CDT", kw: "central chicago texas" },
  { id: "std:ET",  label: "ET",  name: "Eastern Time",  zone: "America/New_York",    std: "EST", dst: "EDT", kw: "eastern new york toronto" },
  { id: "std:UK",  label: "UK time", name: "UK Time",   zone: "Europe/London",       std: "GMT", dst: "BST", kw: "uk britain england london gmt bst" },
  { id: "std:CET-R", label: "CET/CEST", name: "Central European Time", zone: "Europe/Berlin", std: "CET", dst: "CEST", kw: "central european europe berlin paris cet cest" },
  { id: "std:EET-R", label: "EET/EEST", name: "Eastern European Time", zone: "Europe/Athens", std: "EET", dst: "EEST", kw: "eastern european europe athens eet eest" },
  { id: "std:AET", label: "AEST/AEDT", name: "Australian Eastern Time", zone: "Australia/Sydney", std: "AEST", dst: "AEDT", kw: "australia sydney melbourne aet aest aedt" },
  { id: "std:NZT", label: "NZST/NZDT", name: "New Zealand Time", zone: "Pacific/Auckland", std: "NZST", dst: "NZDT", kw: "new zealand auckland nzt nzst nzdt" },
  // Fixed-offset standard times
  { id: "std:GMT", label: "GMT", name: "Greenwich Mean Time", zone: "Etc/GMT", fixed: true, region: "std:UK", kw: "greenwich" },
  { id: "std:PST", label: "PST", name: "Pacific Standard Time", zone: "Etc/GMT+8", fixed: true, region: "std:PT", kw: "pacific" },
  { id: "std:PDT", label: "PDT", name: "Pacific Daylight Time", zone: "Etc/GMT+7", fixed: true, region: "std:PT", kw: "pacific" },
  { id: "std:MST", label: "MST", name: "Mountain Standard Time", zone: "Etc/GMT+7", fixed: true, region: "std:MT", kw: "mountain" },
  { id: "std:MDT", label: "MDT", name: "Mountain Daylight Time", zone: "Etc/GMT+6", fixed: true, region: "std:MT", kw: "mountain" },
  { id: "std:CST", label: "CST (US)", name: "Central Standard Time", zone: "Etc/GMT+6", fixed: true, region: "std:CT", kw: "cst central" },
  { id: "std:CDT", label: "CDT", name: "Central Daylight Time", zone: "Etc/GMT+5", fixed: true, region: "std:CT", kw: "central" },
  { id: "std:EST", label: "EST", name: "Eastern Standard Time", zone: "Etc/GMT+5", fixed: true, region: "std:ET", kw: "eastern" },
  { id: "std:EDT", label: "EDT", name: "Eastern Daylight Time", zone: "Etc/GMT+4", fixed: true, region: "std:ET", kw: "eastern" },
  { id: "std:AKST", label: "AKST", name: "Alaska Standard Time", zone: "Etc/GMT+9", fixed: true, kw: "alaska" },
  { id: "std:AKDT", label: "AKDT", name: "Alaska Daylight Time", zone: "Etc/GMT+8", fixed: true, kw: "alaska" },
  { id: "std:HST", label: "HST", name: "Hawaii Standard Time", zone: "Pacific/Honolulu", fixed: true, kw: "hawaii" },
  { id: "std:BST", label: "BST (UK)", name: "British Summer Time", zone: "Etc/GMT-1", fixed: true, region: "std:UK", kw: "bst british" },
  { id: "std:CET", label: "CET", name: "Central European Time", zone: "Etc/GMT-1", fixed: true, region: "std:CET-R", kw: "central european" },
  { id: "std:CEST", label: "CEST", name: "Central European Summer Time", zone: "Etc/GMT-2", fixed: true, region: "std:CET-R", kw: "central european" },
  { id: "std:EET", label: "EET", name: "Eastern European Time", zone: "Etc/GMT-2", fixed: true, region: "std:EET-R", kw: "eastern european egypt" },
  { id: "std:EEST", label: "EEST", name: "Eastern European Summer Time", zone: "Etc/GMT-3", fixed: true, region: "std:EET-R", kw: "eastern european" },
  { id: "std:MSK", label: "MSK", name: "Moscow Standard Time", zone: "Europe/Moscow", fixed: true, kw: "moscow russia" },
  { id: "std:GST", label: "GST (Gulf)", name: "Gulf Standard Time", zone: "Asia/Dubai", fixed: true, kw: "gst gulf uae dubai" },
  { id: "std:AST", label: "AST (Arabia)", name: "Arabia Standard Time", zone: "Asia/Riyadh", fixed: true, kw: "ast arabia saudi riyadh" },
  { id: "std:IST", label: "IST (India)", name: "India Standard Time", zone: "Asia/Kolkata", fixed: true, kw: "ist india" },
  { id: "std:PKT", label: "PKT", name: "Pakistan Standard Time", zone: "Asia/Karachi", fixed: true, kw: "pakistan" },
  { id: "std:SGT", label: "SGT", name: "Singapore Time", zone: "Asia/Singapore", fixed: true, kw: "singapore" },
  { id: "std:HKT", label: "HKT", name: "Hong Kong Time", zone: "Asia/Hong_Kong", fixed: true, kw: "hong kong" },
  { id: "std:CSTC", label: "CST (China)", name: "China Standard Time", zone: "Asia/Shanghai", fixed: true, kw: "cst china beijing" },
  { id: "std:JST", label: "JST", name: "Japan Standard Time", zone: "Asia/Tokyo", fixed: true, kw: "japan tokyo" },
  { id: "std:KST", label: "KST", name: "Korea Standard Time", zone: "Asia/Seoul", fixed: true, kw: "korea seoul" },
  { id: "std:AEST", label: "AEST", name: "Australian Eastern Standard Time", zone: "Etc/GMT-10", fixed: true, region: "std:AET", kw: "australia" },
  { id: "std:AEDT", label: "AEDT", name: "Australian Eastern Daylight Time", zone: "Etc/GMT-11", fixed: true, region: "std:AET", kw: "australia" },
  { id: "std:NZST", label: "NZST", name: "New Zealand Standard Time", zone: "Etc/GMT-12", fixed: true, region: "std:NZT", kw: "new zealand" },
  { id: "std:NZDT", label: "NZDT", name: "New Zealand Daylight Time", zone: "Etc/GMT-13", fixed: true, region: "std:NZT", kw: "new zealand" },
  { id: "std:SAST", label: "SAST", name: "South Africa Standard Time", zone: "Africa/Johannesburg", fixed: true, kw: "south africa" },
  { id: "std:EAT", label: "EAT", name: "East Africa Time", zone: "Africa/Nairobi", fixed: true, kw: "east africa kenya" },
];
const STD_BY_ID = Object.fromEntries(STANDARD_TIMES.map((s) => [s.id, s]));
// Resolve a directory id to the IANA zone used for calculations.
function tzOf(id) { return STD_BY_ID[id] ? STD_BY_ID[id].zone : id; }

/* Chronos — App Logic
 * Load order: chronos-timezones.js, then this file.
 * Reuses the same Intl-based conversion math from the dropdown demo,
 * but drives the slider + destination-card UI Stitch generated instead.
 */

/* ---------------- Core conversion math (unchanged) ---------------- */

function getTimeZoneOffsetMinutes(date, timeZone) {
  const dtf = new Intl.DateTimeFormat("en-US", {
    timeZone: tzOf(timeZone), hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const parts = dtf.formatToParts(date).reduce((acc, p) => {
    if (p.type !== "literal") acc[p.type] = p.value;
    return acc;
  }, {});
  const asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
  return (asUTC - date.getTime()) / 60000;
}

function zonedWallTimeToUtc(dateStr, timeStr, fromZone) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [hh, mm] = timeStr.split(":").map(Number);
  const guessUtcMs = Date.UTC(y, m - 1, d, hh, mm, 0);
  const offsetMin = getTimeZoneOffsetMinutes(new Date(guessUtcMs), fromZone);
  return new Date(guessUtcMs - offsetMin * 60000);
}

function formatOffset(utcDate, timeZone) {
  const minutes = getTimeZoneOffsetMinutes(utcDate, timeZone);
  const sign = minutes >= 0 ? "+" : "-";
  const abs = Math.abs(minutes);
  const hh = String(Math.floor(abs / 60)).padStart(2, "0");
  const mm = String(abs % 60).padStart(2, "0");
  return mm === "00" ? `GMT${sign}${parseInt(hh, 10)}` : `GMT${sign}${hh}:${mm}`;
}

function relativeOffsetLabel(utcDate, fromZone, toZone) {
  const diffMin = getTimeZoneOffsetMinutes(utcDate, toZone) - getTimeZoneOffsetMinutes(utcDate, fromZone);
  const sign = diffMin >= 0 ? "+" : "-";
  const abs = Math.abs(diffMin);
  const hh = Math.floor(abs / 60);
  const mm = abs % 60;
  return mm === 0 ? `${sign}${hh}h` : `${sign}${hh}h${mm}m`;
}

function dayDifference(utcInstant, fromZone, toZone) {
  const fromDateStr = new Intl.DateTimeFormat("en-CA", { timeZone: tzOf(fromZone) }).format(utcInstant);
  const toDateStr = new Intl.DateTimeFormat("en-CA", { timeZone: tzOf(toZone) }).format(utcInstant);
  const fromDate = new Date(fromDateStr + "T00:00:00Z");
  const toDate = new Date(toDateStr + "T00:00:00Z");
  return Math.round((toDate - fromDate) / 86400000);
}

function getZoneName(utcDate, zoneId, style) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: tzOf(zoneId), timeZoneName: style }).formatToParts(utcDate);
  const tzPart = parts.find((p) => p.type === "timeZoneName");
  return tzPart ? tzPart.value : zoneId;
}

function formatHM(utcDate, zoneId, use12) {
  return new Intl.DateTimeFormat(use12 ? "en-US" : "en-GB", {
    timeZone: tzOf(zoneId),
    hour: use12 ? "numeric" : "2-digit",
    minute: "2-digit",
    hour12: !!use12,
  }).format(utcDate);
}

function detectUserTimeZone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return "UTC"; }
}

/* ---------------- Timezone directory (search) ---------------- */

function buildZoneDirectory() {
  const list = [];
  STANDARD_TIMES.forEach((s) => {
    list.push({
      id: s.id,
      isStandard: true,
      cityLabel: s.label,
      fullName: s.name,
      countryName: s.name + (s.fixed ? " · fixed" : " · follows daylight saving"),
      searchText: `${s.label} ${s.name} ${s.std || ""} ${s.dst || ""} ${s.kw || ""}`.toLowerCase(),
      abbrs: [s.label, s.std, s.dst, s.id.replace("std:", "").replace("-R", "")].filter(Boolean).map((x) => x.toLowerCase()),
    });
  });
  CHRONOS_COUNTRIES.forEach((country) => {
    country.zones.forEach((zone) => {
      list.push({
        id: zone.id,
        cityLabel: zone.label,
        countryName: country.name,
        searchText: `${zone.label} ${country.name}`.toLowerCase(),
        pageUrl: `/time-in-${country.slug}/` + (zone.id === country.main ? "" : `?from=${encodeURIComponent(zone.id)}`),
      });
    });
  });
  list.push({ id: "UTC", cityLabel: "UTC", countryName: "Coordinated Universal Time", searchText: "utc" });
  return list;
}

function findZoneEntry(directory, zoneId) {
  return directory.find((z) => z.id === zoneId);
}

/* ---------------- App state ---------------- */

const ZONE_DIRECTORY = buildZoneDirectory();

// A sensible default spread of major zones — shown out of the box so the
// app is useful before the visitor adds anything themselves.
const MAJOR_ZONES = [
  "UTC",
  "America/New_York",
  "America/Chicago",
  "America/Denver",
  "America/Los_Angeles",
  "Europe/London",
  "Europe/Paris",
  "Asia/Dubai",
  "Asia/Kolkata",
  "Asia/Shanghai",
  "Asia/Tokyo",
  "Australia/Sydney",
];

const state = {
  // Origin defaults to UTC — the zone event times are usually announced in
  // ("5pm UTC"). Your own local zone goes in destinations instead, so the
  // natural flow is: set origin/slider to the source time, read your zone's
  // card for the converted local time.
  originZoneId: "UTC",
  destinations: [],
  sliderMinutes: 0,
  use12Hour: true,
  live: true, // follows the real clock until the user picks a time
  dateStr: null, // YYYY-MM-DD picked by the user (in the origin zone); null = today
  expanded: new Set(), // destination cards showing their detail line
};

(() => {
  const detected = detectUserTimeZone();
  const detectedIsKnown = !!findZoneEntry(ZONE_DIRECTORY, detected);

  // Generated landing pages preset the source (and sometimes destinations) via
  // window.OFFSET_PRESET; a ?from=<zone> link can also choose the starting zone.
  const preset = typeof window !== "undefined" ? window.OFFSET_PRESET : null;
  if (preset && findZoneEntry(ZONE_DIRECTORY, preset.origin)) state.originZoneId = preset.origin;
  try {
    const from = new URLSearchParams(window.location.search).get("from");
    if (from && findZoneEntry(ZONE_DIRECTORY, from)) state.originZoneId = from;
  } catch (e) { /* ignore */ }

  // Keep the default list short so the "Add a place or time zone" card stays in view.
  const originTz = tzOf(state.originZoneId);
  const candidates = [detectedIsKnown && detected !== "UTC" ? detected : null, "std:PT", "std:ET", "std:UK"]
    .filter((z) => z && tzOf(z) !== originTz);
  state.destinations = candidates.slice(0, 3);
  if (preset && preset.destinations && preset.destinations.length) {
    const dests = preset.destinations.filter((z) => tzOf(z) !== originTz && findZoneEntry(ZONE_DIRECTORY, z));
    if (dests.length) state.destinations = dests;
  }

  // Initialize the slider to "now", expressed as wall-clock time in whatever
  // the origin zone actually is (works correctly regardless of which zone
  // that ends up being).
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: tzOf(state.originZoneId), hourCycle: "h23", hour: "2-digit", minute: "2-digit",
  }).formatToParts(new Date()).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  state.sliderMinutes = parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
})();

let modalMode = "add"; // "add" | "origin"

/* ---------------- Rendering ---------------- */

function nowMinutesInOrigin() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: tzOf(state.originZoneId), hourCycle: "h23", hour: "2-digit", minute: "2-digit",
  }).formatToParts(new Date()).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  return parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
}

function updateNowButton() {
  const el = document.getElementById("now-button");
  if (!el) return;
  if (state.live) {
    el.disabled = true;
    el.className = "mt-3 inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-label text-xs tracking-widest uppercase bg-surface-container-high text-tertiary cursor-default";
    el.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-tertiary animate-pulse"></span> Live: showing the current time';
  } else {
    el.disabled = false;
    el.className = "mt-3 inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-label text-xs tracking-widest uppercase bg-primary text-on-primary hover:opacity-90 cursor-pointer";
    el.innerHTML = '<span class="material-symbols-outlined text-[16px]">schedule</span> Back to current time';
  }
}

function currentOriginDateStr() {
  // "Today" as a calendar date, expressed in the origin zone, right now (real date).
  return new Intl.DateTimeFormat("en-CA", { timeZone: tzOf(state.originZoneId) }).format(new Date());
}

function sliderMinutesToTimeStr(minutes) {
  const hh = String(Math.floor(minutes / 60)).padStart(2, "0");
  const mm = String(minutes % 60).padStart(2, "0");
  return `${hh}:${mm}`;
}

function computeUtcInstant() {
  const dateStr = state.dateStr || currentOriginDateStr();
  const timeStr = sliderMinutesToTimeStr(state.sliderMinutes);
  return zonedWallTimeToUtc(dateStr, timeStr, state.originZoneId);
}

function dayLabel(diff) {
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  return diff > 0 ? `+${diff} days` : `${diff} days`;
}

function renderOrigin(utcInstant) {
  const entry = findZoneEntry(ZONE_DIRECTORY, state.originZoneId);
  const title = document.getElementById("origin-title");
  const subtitle = document.getElementById("origin-subtitle");
  const dateEl = document.getElementById("origin-date");
  const mainTime = document.getElementById("main-time-display");

  if (title && entry) title.textContent = entry.isStandard || entry.cityLabel === "UTC" ? entry.cityLabel : `${entry.cityLabel}, ${entry.countryName}`;
  if (subtitle) subtitle.textContent = entry && entry.isStandard
    ? standardNote(entry, utcInstant)
    : `${getZoneName(utcInstant, state.originZoneId, "long")} (${formatOffset(utcInstant, state.originZoneId)})`;
  const hint = document.getElementById("origin-hint");
  if (hint) {
    const msg = entry && entry.isStandard ? standardHint(entry, utcInstant) : "";
    hint.textContent = msg;
    hint.classList.toggle("hidden", !msg);
  }
  if (dateEl) {
    dateEl.textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: tzOf(state.originZoneId), month: "short", day: "numeric", year: "numeric",
    }).format(utcInstant);
  }
  if (mainTime) {
    const txt = formatHM(utcInstant, state.originZoneId, state.use12Hour);
    const m = /^(.*?)\s*([AP]M)$/i.exec(txt);
    mainTime.innerHTML = m ? `${m[1]} <span class="text-[0.3em] tracking-normal font-semibold">${m[2]}</span>` : txt;
  }
}


/* Standard offset (minutes) of a zone for the year of utcInstant = its smaller offset of Jan vs Jul. */
function baseOffsetMinutes(zone, utcInstant) {
  const y = new Date(utcInstant).getUTCFullYear();
  return Math.min(
    getTimeZoneOffsetMinutes(new Date(Date.UTC(y, 0, 1)), zone),
    getTimeZoneOffsetMinutes(new Date(Date.UTC(y, 6, 1)), zone)
  );
}

function utcLabel(utcInstant, id) {
  return formatOffset(utcInstant, id).replace("GMT", "UTC");
}

/* Short label for what a standard-time entry means at a given moment. */
function standardNote(entry, utcInstant) {
  const s = STD_BY_ID[entry.id];
  const off = utcLabel(utcInstant, entry.id);
  if (!s.fixed) {
    const cur = getTimeZoneOffsetMinutes(utcInstant, s.zone);
    return `${s.name}: currently ${cur === baseOffsetMinutes(s.zone, utcInstant) ? s.std : s.dst} (${off})`;
  }
  return `${s.name} (${off}), fixed all year`;
}

/* Warn when a fixed abbreviation (e.g. PST) differs from what its region uses right now. */
function standardHint(entry, utcInstant) {
  const s = STD_BY_ID[entry.id];
  if (!s || !s.fixed || !s.region) return "";
  const r = STD_BY_ID[s.region];
  const mine = getTimeZoneOffsetMinutes(utcInstant, s.zone);
  const theirs = getTimeZoneOffsetMinutes(utcInstant, r.zone);
  if (mine === theirs) return "";
  const nowAbbr = theirs === baseOffsetMinutes(r.zone, utcInstant) ? r.std : r.dst;
  const label = s.label.replace(/ \(.*\)/, "");
  return `Heads-up: ${label} is fixed at ${utcLabel(utcInstant, entry.id)} all year, but ${r.name} is on ${nowAbbr} right now (${utcLabel(utcInstant, s.region)}). If the announcement just means "${r.name}", pick ${r.label} instead.`;
}


const DATE_FMT_OPTS = { weekday: "short", month: "short", day: "numeric", year: "numeric" };

function cardDetailText(utcInstant, originEntry, entry, zoneId) {
  const dateOf = (id) => new Intl.DateTimeFormat("en-US", { ...DATE_FMT_OPTS, timeZone: tzOf(id) }).format(utcInstant);
  const from = originEntry ? originEntry.cityLabel : state.originZoneId;
  const to = entry.cityLabel;
  const diffMin = getTimeZoneOffsetMinutes(utcInstant, zoneId) - getTimeZoneOffsetMinutes(utcInstant, state.originZoneId);
  const abs = Math.abs(diffMin), h = Math.floor(abs / 60), m = abs % 60;
  const gap = diffMin === 0 ? `${to} is on the same time as ${from}.`
    : `${to} is ${h ? h + (h === 1 ? " hour" : " hours") : ""}${h && m ? " " : ""}${m ? m + " minutes" : ""} ${diffMin > 0 ? "ahead of" : "behind"} ${from}.`;
  const time = (id) => `<span class="text-primary font-bold">${formatHM(utcInstant, id, state.use12Hour)}</span>`;
  const date = (id) => `<span class="text-tertiary font-semibold">${dateOf(id)}</span>`;
  const place = (name) => `<span class="text-on-surface font-semibold">${name}</span>`;
  return `${time(state.originZoneId)} on ${date(state.originZoneId)} in ${place(from)} is ${time(zoneId)} on ${date(zoneId)} in ${place(to)}. ${gap}`;
}

function destinationCardHTML(zoneId, utcInstant) {
  const entry = findZoneEntry(ZONE_DIRECTORY, zoneId);
  if (!entry) return "";
  const timeStr = formatHM(utcInstant, zoneId, state.use12Hour);
  const diffLabel = relativeOffsetLabel(utcInstant, state.originZoneId, zoneId);
  const diffMin = getTimeZoneOffsetMinutes(utcInstant, zoneId) - getTimeZoneOffsetMinutes(utcInstant, state.originZoneId);
  const diffColor = diffMin === 0 ? "text-on-surface-variant" : diffMin > 0 ? "text-tertiary" : "text-secondary";
  const day = dayLabel(dayDifference(utcInstant, state.originZoneId, zoneId));
  const zoneName = entry.isStandard ? standardNote(entry, utcInstant) : getZoneName(utcInstant, zoneId, "short");

  return `
    <div class="bg-surface-container-high hover:bg-surface-container-highest transition-all duration-300 rounded-xl p-6 cursor-pointer group relative" data-zone-id="${zoneId}" tabindex="0" role="button" aria-expanded="${state.expanded.has(zoneId)}" title="Click for details">
      <button class="js-remove-destination absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity text-outline hover:text-error material-symbols-outlined text-base" data-zone-id="${zoneId}" title="Remove">close</button>
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg overflow-hidden bg-surface-variant flex items-center justify-center">
            <span class="material-symbols-outlined text-sm text-secondary">location_on</span>
          </div>
          <div>
            <h4 class="font-body font-bold text-base leading-none flex items-center gap-1">${entry.cityLabel}${entry.pageUrl ? `<a href="${entry.pageUrl}" class="js-page-link material-symbols-outlined text-base text-outline hover:text-primary" aria-label="Open the ${entry.countryName} time page" title="Open the ${entry.countryName} time page">arrow_outward</a>` : ""}</h4>
            <p class="font-label text-[10px] text-outline uppercase tracking-wider mt-1">${entry.isStandard || zoneName === formatOffset(utcInstant, zoneId) ? zoneName : `${zoneName} (${formatOffset(utcInstant, zoneId)})`}</p>
          </div>
        </div>
        <span class="font-label text-[11px] ${diffColor} font-bold">${diffLabel}</span>
      </div>
      <div class="flex items-baseline justify-between">
        <span class="font-display text-4xl font-semibold">${timeStr}</span>
        <span class="font-label text-xs text-on-surface-variant flex items-center gap-1">${day}<span class="material-symbols-outlined text-base transition-transform ${state.expanded.has(zoneId) ? "rotate-180" : ""}">expand_more</span></span>
      </div>
      ${state.expanded.has(zoneId) ? `<p class="mt-4 pt-4 border-t border-outline-variant/30 font-body text-sm text-on-surface-variant leading-relaxed">${cardDetailText(utcInstant, findZoneEntry(ZONE_DIRECTORY, state.originZoneId), entry, zoneId)}</p>` : ""}
    </div>`;
}

function renderDestinations(utcInstant) {
  const container = document.getElementById("destinations-list");
  if (!container) return;
  container.innerHTML = state.destinations.map((z) => destinationCardHTML(z, utcInstant)).join("");
  container.querySelectorAll(".js-remove-destination").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const zoneId = btn.dataset.zoneId;
      state.destinations = state.destinations.filter((z) => z !== zoneId);
      state.expanded.delete(zoneId);
      render();
    });
  });
  container.querySelectorAll("a.js-page-link").forEach((a) => a.addEventListener("click", (e) => e.stopPropagation()));
  container.querySelectorAll(":scope > div[data-zone-id]").forEach((card) => {
    const toggle = () => {
      const id = card.dataset.zoneId;
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      render();
    };
    card.addEventListener("click", toggle);
    card.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target === card) { e.preventDefault(); toggle(); }
    });
  });
}

function renderInsight(utcInstant) {
  const textEl = document.getElementById("insight-text");
  const subEl = document.getElementById("insight-sub");
  if (!textEl || !subEl) return;

  const inBusinessHours = state.destinations.filter((zoneId) => {
    const hour = parseInt(formatHM(utcInstant, zoneId).split(":")[0], 10);
    return hour >= 9 && hour < 18;
  });

  const entries = inBusinessHours.map((z) => findZoneEntry(ZONE_DIRECTORY, z)?.cityLabel).filter(Boolean);

  if (entries.length === 0) {
    textEl.textContent = "Outside typical business hours (9–18) everywhere right now.";
    subEl.textContent = "Drag the slider to find an overlap.";
  } else {
    textEl.textContent = `Good time to reach: ${entries.join(", ")}.`;
    subEl.textContent = "Within 9:00–18:00 local business hours.";
  }
}

function updateFormatToggleUI() {
  const el24 = document.getElementById("formatToggle24");
  const el12 = document.getElementById("formatToggle12");
  if (!el24 || !el12) return;
  const active = "text-[10px] font-label font-bold px-2 py-1 rounded-full bg-primary text-on-primary transition-colors";
  const inactive = "text-[10px] font-label font-bold px-2 py-1 rounded-full text-outline transition-colors";
  el24.className = state.use12Hour ? inactive : active;
  el12.className = state.use12Hour ? active : inactive;
}

function render() {
  if (state.live) { state.sliderMinutes = nowMinutesInOrigin(); state.dateStr = null; }
  const utcInstant = computeUtcInstant();
  renderOrigin(utcInstant);
  renderDestinations(utcInstant);
  renderInsight(utcInstant);
  updateFormatToggleUI();
  renderTicks();
  syncTimeInput();
  updateNowButton();
}

/* ---------------- Slider tick labels + typed time input ---------------- */

function tickLabel(minutes) {
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (!state.use12Hour) return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  const suffix = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m ? `${h12}:${String(m).padStart(2, "0")} ${suffix}` : `${h12} ${suffix}`;
}

function renderTicks() {
  const el = document.getElementById("slider-ticks");
  if (!el) return;
  el.innerHTML = [0, 240, 480, 720, 960, 1200, 1439].map((m) => `<span>${tickLabel(m)}</span>`).join("");
}

function syncTimeInput() {
  const input = document.getElementById("time-input");
  const slider = document.getElementById("global-time-slider");
  if (slider) slider.value = String(state.sliderMinutes);
  if (input && document.activeElement !== input) input.value = sliderMinutesToTimeStr(state.sliderMinutes);
  const dateInput = document.getElementById("date-input");
  if (dateInput) dateInput.value = state.dateStr || currentOriginDateStr();
}

/* ---------------- Modal (search + select zone) ---------------- */

function openModal(mode) {
  modalMode = mode;
  const modal = document.getElementById("tzModal");
  const title = document.getElementById("tzModalTitle");
  const input = document.getElementById("tzSearchInput");
  if (title) title.textContent = mode === "origin" ? "Convert from a place or time zone" : "Add a place or time zone";
  if (modal) modal.classList.remove("hidden");
  if (input) { input.value = ""; input.focus(); }
  renderSearchResults("");
}

function closeModal() {
  const modal = document.getElementById("tzModal");
  if (modal) modal.classList.add("hidden");
}

function renderSearchResults(query) {
  const resultsEl = document.getElementById("tzSearchResults");
  if (!resultsEl) return;
  const q = query.trim().toLowerCase();
  const rank = (z) => (z.abbrs && z.abbrs.includes(q) ? 0 : z.isStandard && z.searchText.startsWith(q) ? 1 : z.isStandard ? 2 : 3);
  const matches = (q === "" ? ZONE_DIRECTORY : ZONE_DIRECTORY.filter((z) => z.searchText.includes(q))
    .map((z, i) => ({ z, i })).sort((a, b) => rank(a.z) - rank(b.z) || a.i - b.i).map((x) => x.z)).slice(0, 40);

  resultsEl.innerHTML = matches.map((z) => `
    <button class="js-tz-result text-left px-3 py-2 rounded-lg hover:bg-surface-container-highest transition-colors flex justify-between items-center" data-zone-id="${z.id}">
      <span class="font-body text-sm">${z.cityLabel}${z.isStandard ? '<span class="ml-2 font-label text-[9px] uppercase tracking-wider text-tertiary">time zone</span>' : ""}</span>
      <span class="font-label text-[10px] text-outline">${z.countryName}</span>
    </button>`).join("");

  resultsEl.querySelectorAll(".js-tz-result").forEach((btn) => {
    btn.addEventListener("click", () => {
      const zoneId = btn.dataset.zoneId;
      if (modalMode === "origin") {
        state.originZoneId = zoneId;
      } else {
        if (!state.destinations.includes(zoneId) && zoneId !== state.originZoneId) {
          state.destinations.push(zoneId);
        }
      }
      closeModal();
      render();
    });
  });
}

/* ---------------- Wiring ---------------- */

function supportsRequiredIntl() {
  try {
    new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Dubai", timeZoneName: "short" }).format(new Date());
    return true;
  } catch {
    return false;
  }
}

function initChronos() {
  if (!supportsRequiredIntl()) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#f5f2fd;background:#0d0e15;min-height:100vh;">This browser does not support the timezone features {{SITE_NAME}} needs. Please update your browser or try Chrome, Firefox, Safari, or Edge.</div>';
    return;
  }

  const slider = document.getElementById("global-time-slider");
  if (slider) {
    slider.value = String(state.sliderMinutes);
    slider.addEventListener("input", () => {
      state.live = false;
      state.sliderMinutes = parseInt(slider.value, 10);
      render();
    });
  }

  document.querySelectorAll(".js-add-destination").forEach((btn) => {
    btn.addEventListener("click", () => openModal("add"));
  });
  const originSelector = document.getElementById("origin-selector");
  if (originSelector) {
    originSelector.addEventListener("click", () => openModal("origin"));
    originSelector.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal("origin"); }
    });
  }

  const modalClose = document.getElementById("tzModalClose");
  if (modalClose) modalClose.addEventListener("click", closeModal);
  const modal = document.getElementById("tzModal");
  if (modal) {
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !modal.classList.contains("hidden")) closeModal();
    });
  }

  const searchInput = document.getElementById("tzSearchInput");
  if (searchInput) searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));

  const timeInput = document.getElementById("time-input");
  if (timeInput) {
    timeInput.addEventListener("input", () => {
      const m = /^(\d{2}):(\d{2})$/.exec(timeInput.value);
      if (!m) return;
      state.live = false;
      state.sliderMinutes = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      render();
    });
  }
  const mainTimeEl = document.getElementById("main-time-display");
  if (mainTimeEl && timeInput) {
    const focusTime = () => { timeInput.focus(); try { timeInput.showPicker && timeInput.showPicker(); } catch (e) {} };
    mainTimeEl.addEventListener("click", focusTime);
    mainTimeEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); focusTime(); } });
  }

  const dateInput = document.getElementById("date-input");
  if (dateInput) {
    dateInput.addEventListener("change", () => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateInput.value)) return;
      state.dateStr = dateInput.value;
      state.live = false;
      render();
    });
  }

  const nowBtn = document.getElementById("now-button");
  if (nowBtn) nowBtn.addEventListener("click", () => { state.live = true; state.dateStr = null; render(); });

  // Keep the clock moving while in live mode (checks once a second, re-renders on minute change).
  const liveTick = () => { if (state.live && nowMinutesInOrigin() !== state.sliderMinutes) render(); };
  setInterval(liveTick, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) liveTick(); });

  const hint = document.getElementById("scroll-hint");
  const more = document.getElementById("more-info");
  if (hint && more) {
    const update = () => {
      const hide = more.getBoundingClientRect().top < window.innerHeight * 0.7;
      hint.classList.toggle("opacity-0", hide);
      hint.classList.toggle("pointer-events-none", hide);
    };
    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    hint.addEventListener("click", () => more.scrollIntoView({ behavior: "smooth", block: "start" }));
    update();
  } else if (hint) {
    hint.remove();
  }

  const formatToggle = document.getElementById("formatToggle");
  if (formatToggle) {
    formatToggle.addEventListener("click", () => {
      state.use12Hour = !state.use12Hour;
      render();
    });
    formatToggle.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        state.use12Hour = !state.use12Hour;
        render();
      }
    });
  }

  render();
}

document.addEventListener("DOMContentLoaded", initChronos);

</script>
</body></html>
